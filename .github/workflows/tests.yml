name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Sin dependencias: la suite corre con la stdlib. Nada que instalar.
      - name: Suite de tests
        run: python3 tests/test_api.py -v


  despliegue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # El generador de SQL tiene que seguir produciendo un compose valido y sin build:
      # si el compose del repo cambia y el generador no lo acompana, esto falla.
      - name: El generador produce un compose desplegable
        run: |
          mkdir -p deploy
          cat > deploy/deploy.env <<'ENV'
          APP=ci-check-artifactshub-000000
          ENVID=0000000000000000000000000
          HOST=example.invalid
          APP_HOST=app.example.invalid
          IMAGE=registry.example.invalid/ns/artifacts-hub:0.0.0
          ENV
          # Un SQL de una version anterior del generador, con la imagen vieja adentro: si
          # sobrevive, alguien lo aplica a mano y devuelve produccion a esa version.
          echo "-- viejo" > deploy/ci-check-artifactshub-000000-update-compose.sql
          python3 deploy/gen-deploy-sql.py
          [ ! -e deploy/ci-check-artifactshub-000000-update-compose.sql ] || { echo "sobrevivio un SQL viejo"; exit 1; }
          [ "$(ls deploy/ci-check-artifactshub-000000-*.sql | wc -l)" = 4 ] || { echo "esperaba exactamente 4 SQL"; ls deploy/*.sql; exit 1; }
          sql=deploy/ci-check-artifactshub-000000-02-compose.sql
          test -s "$sql"
          grep -q "registry.example.invalid/ns/artifacts-hub:0.0.0" "$sql" || { echo "no puso la imagen publicada"; exit 1; }
          grep -q "dokploy-network" "$sql" || { echo "no inyecto dokploy-network"; exit 1; }
          grep -q "build:" "$sql" && { echo "quedo un build: en el compose desplegable"; exit 1; }
          # Lo que hace que el compose ARRANQUE en Dokploy, no solo que se vea valido. Habia dos
          # caminos (con y sin PyYAML) y el de texto no hacia nada de esto, en silencio: aplicar
          # su salida dejaba a nginx sin su conf (Docker crea un DIRECTORIO) y a la galeria sin
          # su hostname. Sin PyYAML a proposito, que es como corre en una maquina cualquiera.
          python3 -c "import yaml" 2>/dev/null && { echo "este job tiene que correr SIN PyYAML"; exit 1; }
          grep -q -- "- ../files/store/default.conf:/etc/nginx/conf.d/default.conf:ro" "$sql" || { echo "el conf de nginx no apunta a ../files/"; exit 1; }
          grep -q -- "- ../files/store/www:/www:ro" "$sql" || { echo "las semillas no apuntan a ../files/"; exit 1; }
          grep -qE -- "^\s+- \./" "$sql" && { echo "quedo un bind relativo ./ (en Dokploy crea un directorio)"; exit 1; }
          grep -q "HUB_APP_HOST: app.example.invalid" "$sql" || { echo "falta HUB_APP_HOST"; exit 1; }
          grep -q "HUB_BASE_URL: https://example.invalid" "$sql" || { echo "HUB_BASE_URL no es la URL publica"; exit 1; }
          echo "generador OK"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El compose del repo tiene que ser valido y correr en cualquier lado.
      - name: docker compose config
        run: docker compose -f docker-compose.yml config >/dev/null && echo "compose OK"

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: |
          docker run --rm -v "$PWD/store/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  # La suite corre desde el codigo fuente, asi que NO ve lo que falta en la imagen: un modulo
  # nuevo que el Dockerfile no copia pasa todos los tests y tira produccion al arrancar
  # (paso con meta.py). Esto construye la imagen DE VERDAD, la levanta y publica con ella.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La imagen arranca y publica
        run: |
          docker build -t hub:ci api/
          D=$(mktemp -d); chmod 777 "$D"
          docker run -d --name hub -p 18090:8080 -e HUB_DATA=/data -e HUB_DB=/data/hub.sqlite3 \
            -e HUB_BASE_URL=http://127.0.0.1:18090 -v "$D":/data hub:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18090/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18090/healthz || { echo "la imagen no arranco:"; docker logs hub; exit 1; }
          docker exec -u hub hub python3 admin.py user add ci >/dev/null
          TOK=$(docker exec -u hub hub python3 admin.py token add ci --label ci | grep -o 'wlart_[a-f0-9]*' | head -1)
          [ -n "$TOK" ] || { echo "no pude sacar un token de la imagen"; exit 1; }
          printf '<!doctype html><html><head><title>Imagen</title></head><body>x</body></html>' > /tmp/p.html
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOK" \
                   -H 'Content-Type: text/html' --data-binary @/tmp/p.html \
                   http://127.0.0.1:18090/api/v1/artifacts/imagen)
          [ "$code" = "201" ] || [ "$code" = "200" ] || { echo "publicar dio $code"; cat /tmp/r.json; docker logs hub; exit 1; }
          grep -q 'window.ARTIFACT=' "$D/a/ci/imagen.html" || { echo "la imagen no inyecta el runtime"; exit 1; }
          echo "imagen OK"

  # La base vive en el MISMO volumen que nginx sirve como docroot. Sin una lista blanca, la
  # raiz servia cualquier archivo del volumen: /hub.sqlite3 se bajaba con un GET (paso en
  # produccion). Esto levanta el stack real —la imagen de la API y nginx con ESTE default.conf,
  # compartiendo el volumen como en el servidor— y prueba lo que ve alguien de afuera.
  docroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuera de lo declarado, la raiz no sirve nada
        run: |
          docker build -t hub:ci api/
          docker network create hubnet
          docker volume create hubdata
          docker run -d --name api --network hubnet --network-alias artifactshub-api \
            -e HUB_DATA=/data -e HUB_DB=/data/hub.sqlite3 -e HUB_BASE_URL=http://127.0.0.1:18091 \
            -v hubdata:/data -v "$PWD/store/www:/www:ro" hub:ci
          docker run -d --name store --network hubnet -p 18091:80 -v hubdata:/usr/share/nginx/html \
            -v "$PWD/store/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18091/healthz >/dev/null && break; sleep 0.5; done
          docker exec -u hub api python3 admin.py user add ci >/dev/null
          TOK=$(docker exec -u hub api python3 admin.py token add ci --label ci | grep -o 'wlart_[a-f0-9]*' | head -1)
          printf '<!doctype html><html><head><title>Raiz</title></head><body>x</body></html>' > /tmp/p.html
          curl -sf -X PUT -H "Authorization: Bearer $TOK" -H 'Content-Type: text/html' \
               --data-binary @/tmp/p.html http://127.0.0.1:18091/api/v1/artifacts/raiz >/dev/null
          # La IP que registra la API es la del VISITANTE: el curl llega desde la red de Docker
          # (privada, como Traefik en produccion) con un X-Forwarded-For; nginx lo resuelve con
          # realip y la API lo lee de X-Real-IP. Antes registraba el X-Forwarded-For crudo.
          curl -sf -X PUT -H "Authorization: Bearer $TOK" -H 'X-Forwarded-For: 203.0.113.7' \
               -H 'Content-Type: application/json' --data '{"a":1}' \
               http://127.0.0.1:18091/api/v1/state/ci/raiz >/dev/null
          ipvista=$(docker exec -u hub api python3 -c "import sqlite3;print(sqlite3.connect('/data/hub.sqlite3').execute(\"select ip from events where action='state' order by id desc limit 1\").fetchone()[0])")
          [ "$ipvista" = "203.0.113.7" ] || { echo "la API vio la IP '$ipvista' y no la del visitante"; exit 1; }
          echo "  ok   la API ve la IP del visitante ($ipvista)"
          docker exec api sh -c 'test -f /data/hub.sqlite3' || { echo "la base no esta donde la prueba supone"; exit 1; }
          fail=0
          want() {  # want <codigo-esperado> <ruta>
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18091$2")
            if [ "$got" = "$1" ]; then echo "  ok   $got  $2"; else echo "  MAL  $got (esperaba $1)  $2"; fail=1; fi
          }
          echo "--- lo que NO se puede bajar ---"
          want 404 /hub.sqlite3
          want 404 /hub.sqlite3-wal
          want 404 /hub.sqlite3-shm
          want 404 /cualquier-archivo.txt
          want 403 /a/ci/.state/raiz.json
          echo "--- lo que SI se sirve ---"
          want 200 /
          want 200 /index.html
          want 200 /healthz
          want 200 /a/ci/raiz.html
          want 401 /api/v1/artifacts
          [ $fail = 0 ] || { docker logs store | tail -20; exit 1; }
          echo "docroot OK"
