# Docker le cambia la IP al contenedor en cada deploy, pero nginx resuelve el upstream
# UNA vez al arrancar y se queda con la vieja => 502 hasta reiniciar nginx. Con resolver
# + una VARIABLE en proxy_pass, nginx resuelve en cada request.
#
# Va a nivel http (arriba de los server) A PROPOSITO: declarado dentro de un server {}
# no lo heredan los demas, y el bloque de la app se quedaria sin resolver el suyo.
resolver 127.0.0.11 valid=10s ipv6=off;

# artifacts-hub — nginx
#
# Rutas:
#   /            landing estatica que NO enumera nada
#   /a/...       los artifacts (estaticos, autoindex off, sin cache)
#   /api/...     la API (tokens, cupos, auditoria)
#   /healthz     salud de la API
#
# OJO con add_header: nginx DESCARTA los add_header del bloque padre si el location
# hijo declara los suyos. Por eso cada location repite los que necesita.
# ---------------------------------------------------------------------------
# HOSTNAME DE LOS ARTIFACTS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # limite de transporte; el limite REAL por artifact lo aplica la API (HUB_MAX_BYTES)
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------- la API ----------
    # OJO: el upstream es un ALIAS, no "api". Este contenedor esta en dokploy-network,
    # donde OTRO servicio del laboratorio ya responde al nombre "api": Docker resuelve
    # al primero que encuentra y nginx terminaba hablandole al contenedor equivocado (502).
    # El alias vive solo en la red interna del stack, asi que es inequivoco.
    location /api/ {
        set $upstream_api artifactshub-api;
        proxy_pass http://$upstream_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        set $upstream_api artifactshub-api;
        proxy_pass http://$upstream_api:8080/healthz;
        access_log off;
    }

    # ---------- los artifacts ----------
    location /a/ {
        autoindex off;          # sin listados, nunca
        index index.html;       # una app se sirve por su index.html
        # $uri/ es lo que hace que /a/<u>/<slug>/ resuelva al index; sin autoindex,
        # una carpeta sin index da 403 (jamas un listado).
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        # sin cache: si subis una version nueva, el link que ya compartiste debe mostrarla
        add_header Cache-Control "no-store" always;
    }

    # ---------- la raiz ----------
    location = / {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ /[.] { deny all; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# ---------------------------------------------------------------------------
# HOSTNAME DE LA INTERFAZ WEB  (app.<dominio>)
#
# TIENE QUE SER DISTINTO AL DE LOS ARTIFACTS, y no es cosmetica: los artifacts son
# HTML de terceros. Si compartieran origen con esta interfaz, el JavaScript de
# cualquiera de ellos podria leer la cookie de sesion de quien mira la galeria.
# Por eso este bloque NO sirve /a/: todo lo que no sea la app lo contesta la API
# con 404, y ningun artifact es alcanzable desde este origen.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # Regex en vez de un nombre literal: asi el archivo del repo sirve tal cual, sin
    # sustituciones fragiles que se olvidan (olvidarla manda la app al bloque de
    # artifacts). El nombre exacto lo valida la API con HUB_APP_HOST.
    server_name ~^app\.;

    server_tokens off;

    location / {
        set $upstream_api artifactshub-api;
        proxy_pass http://$upstream_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
}
